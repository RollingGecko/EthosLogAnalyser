name: Build

# Reusable workflow: runs the test matrix and builds the Windows EXE.
# Called by tests.yml (every push/PR) and release.yml (release tags).
# The EXE is uploaded as the artifact "EthosLogAnalyser-exe".

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    env:
      REQUIRE_GUI_TEST: "1"      # the GUI test must not be skipped in CI
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"      # oldest supported version, pandas 2.x
          - os: ubuntu-latest
            python: "3.12"     # current version, pandas 3.x
          - os: windows-latest
            python: "3.12"     # target platform of the EXE
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install package and test tools
        run: python -m pip install -e ".[test]"

      - name: Provide a virtual display for the GUI test
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run tests (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -v

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest -v

  exe:
    name: Build Windows EXE
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build EXE
        run: scripts\build_exe.bat
        shell: cmd

      - name: Check that the EXE was created
        run: if (!(Test-Path dist\EthosLogAnalyser.exe)) { exit 1 }
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: EthosLogAnalyser-exe
          path: dist/EthosLogAnalyser.exe
          retention-days: 30
