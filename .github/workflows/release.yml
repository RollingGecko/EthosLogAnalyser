name: Release

# Publishes a GitHub release with the Windows EXE, the user guides (PDF, English and German) and a ZIP with all of
# them when a version tag
# vX.Y.Z (or a pre-release such as vX.Y.Z-beta.1) is pushed (see docs/releasing.md). This is the only workflow that
# can create a release.
#
# Dry run (everything except publishing): manually via "Run workflow"
# (workflow_dispatch) on any branch. It uploads the renamed EXE, the user
# guides, the ZIP and the release notes as the artifact "release-preview"
# instead of creating a release. Pull requests do not run this workflow: tests.yml checks version
# and changelog and builds the test EXE there, so nothing is built twice.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check version and changelog
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tag, __version__ and CHANGELOG.md
        id: check
        env:
          IS_TAG: ${{ github.ref_type == 'tag' }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$IS_TAG" = "true" ]; then
            python scripts/release_check.py --tag "$TAG" --notes-out release-notes.md
          else
            python scripts/release_check.py --notes-out release-notes.md
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 7

  build:
    name: CI
    needs: check
    uses: ./.github/workflows/build.yml

  release:
    name: ${{ github.event_name == 'push' && 'Publish release' || 'Release dry run' }}
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      PRERELEASE: ${{ needs.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4          # the user guides (PDF) are kept in docs/

      - uses: actions/download-artifact@v4
        with:
          name: EthosLogAnalyser-exe
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: .

      - name: Name the EXE and the user guides after the version, pack the ZIP
        run: |
          mv dist/EthosLogAnalyser.exe "dist/EthosLogAnalyser-v${VERSION}.exe"
          for language in en de; do
            guide="docs/user-guide_${language}.pdf"
            test -s "$guide" || { echo "::error::$guide is missing"; exit 1; }
            cp "$guide" "dist/EthosLogAnalyser-v${VERSION}-user-guide-${language}.pdf"
          done
          # one download for new users: the EXE and both guides side by side
          (cd dist && zip "EthosLogAnalyser-v${VERSION}.zip" \
            "EthosLogAnalyser-v${VERSION}.exe" \
            "EthosLogAnalyser-v${VERSION}-user-guide-en.pdf" \
            "EthosLogAnalyser-v${VERSION}-user-guide-de.pdf")
          ls -l dist

      - name: Compose the release text (download list, what's new, link to the full changelog)
        run: |
          {
            echo "## Download"
            echo
            echo "- **EthosLogAnalyser-v${VERSION}.zip**: the app and the user guides (English, German) – unpack and start the EXE."
            echo "- EthosLogAnalyser-v${VERSION}.exe: the app alone."
            echo "- EthosLogAnalyser-v${VERSION}-user-guide-en.pdf / -de.pdf: the user guides alone."
            echo
            echo "## What's new"
            echo
            cat release-notes.md
            echo
            echo "Full history: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/CHANGELOG.md)"
          } > release-body.md
          echo "--- Release text ---"
          cat release-body.md

      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flag=""
          if [ "$PRERELEASE" = "true" ]; then flag="--prerelease"; fi
          gh release create "$TAG" \
            "dist/EthosLogAnalyser-v${VERSION}.zip" \
            "dist/EthosLogAnalyser-v${VERSION}.exe" \
            "dist/EthosLogAnalyser-v${VERSION}-user-guide-en.pdf" \
            "dist/EthosLogAnalyser-v${VERSION}-user-guide-de.pdf" $flag \
            --repo "${{ github.repository }}" \
            --title "EthosLogAnalyser v${VERSION}" \
            --notes-file release-body.md \
            --verify-tag

      - name: Upload release preview (dry run)
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: release-preview
          path: |
            dist/EthosLogAnalyser-v${{ env.VERSION }}.zip
            dist/EthosLogAnalyser-v${{ env.VERSION }}.exe
            dist/EthosLogAnalyser-v${{ env.VERSION }}-user-guide-*.pdf
            release-body.md
          retention-days: 7
