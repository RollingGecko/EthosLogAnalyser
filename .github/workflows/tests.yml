name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    env:
      REQUIRE_GUI_TEST: "1"      # Oberflächentest darf in der CI nicht übersprungen werden
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"      # älteste unterstützte Version, pandas 2.x
          - os: ubuntu-latest
            python: "3.12"     # aktuelle Version, pandas 3.x
          - os: windows-latest
            python: "3.12"     # Zielplattform der EXE
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Paket und Testwerkzeuge installieren
        run: python -m pip install -e ".[test]"

      - name: Virtuellen Bildschirm für den Oberflächentest bereitstellen
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Tests (Linux, mit virtuellem Bildschirm)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -v

      - name: Tests (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest -v

  exe:
    name: Windows-EXE bauen
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: EXE bauen
        run: scripts\build_exe.bat
        shell: cmd

      - name: Prüfen, ob die EXE erzeugt wurde
        run: if (!(Test-Path dist\EthosLogAnalyser.exe)) { exit 1 }
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: EthosLogAnalyser-exe
          path: dist/EthosLogAnalyser.exe
          retention-days: 30
